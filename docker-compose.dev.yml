services:

  backend:
    build:
      context: .
      dockerfile: dockerfile.dev

    container_name: movie-backend-dev

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      - NODE_ENV=development
      
      - MAILTRAP_SMTP_HOST=${MAILTRAP_SMTP_HOST}
      - MAILTRAP_SMTP_PORT=${MAILTRAP_SMTP_PORT}
      - MAILTRAP_SMTP_USER=${MAILTRAP_SMTP_USER}
      - MAILTRAP_SMTP_PASS=${MAILTRAP_SMTP_PASS}

      - MAIL_FROM=${MAIL_FROM}
      - CLIENT_URL=${CLIENT_URL}

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile.dev

    container_name: movie-frontend-dev

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend