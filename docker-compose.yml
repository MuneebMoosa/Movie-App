version: "3.9"

services:
  backend:
    build: .
    container_name: movie-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./.env:/app/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: movie-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped