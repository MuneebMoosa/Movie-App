services:

  backend:
    build: .
    container_name: movie-backend

    ports:
      - "3000:3000"

    restart: unless-stopped

    environment:
      NODE_ENV: production

      MONGO_URI: ${MONGO_URI}

      MAILTRAP_SMTP_HOST: ${MAILTRAP_SMTP_HOST}
      MAILTRAP_SMTP_PORT: ${MAILTRAP_SMTP_PORT}
      MAILTRAP_SMTP_USER: ${MAILTRAP_SMTP_USER}
      MAILTRAP_SMTP_PASS: ${MAILTRAP_SMTP_PASS}

      MAIL_FROM: ${MAIL_FROM}
      CLIENT_URL: ${CLIENT_URL}


  frontend:
    build: ./frontend
    container_name: movie-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped